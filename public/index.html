<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Рецепты" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        width: 100%;
        height: var(--app-height, 100%);
        min-height: 100%;
        margin: 0;
        background-color: #000000;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: var(--app-height, 100%);
        min-height: 0;
        flex: 1;
      }

      /* Keep the app tied to the currently visible mobile viewport. This
         avoids iOS Safari/PWA using a taller legacy layout viewport. */
      @supports (height: 100dvh) {
        html,
        body,
        #root {
          height: var(--app-height, 100dvh);
        }
      }

      /* React Native fields provide their own shape and contrast. Prevent the
         browser from drawing an extra rectangular focus ring over them. */
      input:focus,
      textarea:focus {
        outline: none !important;
        box-shadow: none !important;
      }
    </style>
    <script>
      (function () {
        function isIOS() {
          return /iPad|iPhone|iPod/.test(navigator.userAgent)
            || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        }

        function updateAppHeight() {
          var viewport = window.visualViewport;
          var viewportHeight = viewport ? viewport.height : window.innerHeight;
          var standalone = window.matchMedia('(display-mode: standalone)').matches
            || navigator.standalone === true;
          var keyboardOpen = viewportHeight < window.screen.height * 0.72;
          var height = standalone && isIOS() && !keyboardOpen
            ? Math.max(window.innerHeight, window.screen.height)
            : viewportHeight;

          document.documentElement.style.setProperty('--app-height', Math.ceil(height) + 'px');
        }

        updateAppHeight();
        window.addEventListener('resize', updateAppHeight);
        window.addEventListener('orientationchange', updateAppHeight);
        if (window.visualViewport) {
          window.visualViewport.addEventListener('resize', updateAppHeight);
        }
      })();
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
